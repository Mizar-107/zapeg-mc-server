# ATM9-based custom pack — server (brief §6, §9 Phase 1–2)
# Everything declarative: base pack + extra mods resolve at container start.
services:
  mc:
    image: itzg/minecraft-server:java17    # MC 1.20.1 Forge => Java 17
    container_name: atm9-mc
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Optional host-specific CPU affinity. Blank = all host CPUs; never copy a
    # cpuset from another machine without checking its logical CPU topology.
    cpuset: "${MC_CPUSET:-}"
    # Must exceed STOP_SERVER_ANNOUNCE_DELAY (20s) below, or `docker compose stop`'s
    # own default 10s timeout SIGKILLs the container mid-shutdown, before the world
    # save even starts (confirmed: exit code 137, no "Saving..." in the log).
    stop_grace_period: 60s
    # Image default start_period (120s) is too short for this modpack's ~500s
    # boot — was flipping to "unhealthy" mid-load (port not open yet), which
    # made depends_on: service_healthy (heraldor/backup) fail immediately.
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      start_period: 900s
      retries: 3
    ports:
      - "25565:25565"
      - "8100:8100"                        # BlueMap web UI (reverse-proxy/VPN it; don't expose raw)
    environment:
      EULA: "TRUE"
      TZ: Europe/Istanbul
      SEED: ${WORLD_SEED:-}                # empty = random. Set after the seed audition
                                           # (HOSTING.md §World protocol), BEFORE the real world.

      # ---- base pack -------------------------------------------------------
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: all-the-mods-9
      CF_FILE_ID: "7097953"                # ATM9 1.1.1 (2025-10-12), Forge 47.4.0.
                                           # Bump deliberately; run scripts/snapshot.sh first.
      # The base contains CC:Tweaked 1.113.1; /citizens-mods supplies the pinned
      # 1.116.1 replacement. Never let AUTO_CURSEFORGE install both mod-ID copies.
      CF_EXCLUDE_MODS: "cc-tweaked"
      # Re-evaluate the exclusion against existing /data installs as well as
      # fresh ones; otherwise AUTO_CURSEFORGE may retain its cached base copy.
      CF_FORCE_SYNCHRONIZE: "true"
      # Image bundles a CF API key; set your own in .env if downloads throttle.
      CF_API_KEY: ${CF_API_KEY:-}
      # ATM9 1.1.1 pins Forge 47.4.0, but easy_npc 7.7.7 needs >=47.4.10 and
      # immersive-petroleum needs >=47.4.6 (all their CF builds do — checked).
      # Override just the loader, keep the pack pin as-is.
      CF_MOD_LOADER_VERSION: "47.4.10"

      # ---- manual additions (brief §4) — exact pins live in extras/cf-mods.txt
      CURSEFORGE_FILES: "@/extras/cf-mods.txt"
      # Modrinth pins. Server-only: chunky (1.20.1 Forge is Modrinth-only), bluemap
      # (5.3 = last Java-17 build), incendium (nether overhaul, Stardust).
      # Client+server (players install too): better-combat. Its exact
      # playerAnimator dependency already ships in the ATM9 1.1.1 manifest.
      MODRINTH_PROJECTS: "chunky:1.3.146,bluemap:5.3-forge-1.20,incendium:5.3.1,better-combat:1.9.0+1.20.1-forge"
      # Repo-tracked replacement/custom jars (CC:Tweaked + owned ZapeG jars).
      # itzg records this MODS source separately from the base/resolver lists.
      MODS: /citizens-mods

      # ---- shared citizen brain (opt-in) ----------------------------------
      # Blank URL leaves the mod loaded but its LLM controller disabled. The
      # bridge token is intentionally different from the Ollama API key.
      CITIZENS_BRAIN_URL: ${CITIZENS_BRAIN_URL:-}
      CITIZENS_BRAIN_TOKEN: ${CITIZENS_BRAIN_TOKEN:-}
      CITIZENS_BRAIN_REQUEST_TIMEOUT_MS: "150000"
      CITIZENS_BRAIN_TURN_TIMEOUT_MS: "600000"
      # Protocol-3 durable physical jobs use independent persisted budgets.
      # Paused time (owner/body/brain/input unavailable) does not consume the
      # active-time budget.
      CITIZENS_JOB_MAX_ACTIONS: "${CITIZENS_JOB_MAX_ACTIONS:-128}"
      CITIZENS_JOB_MAX_MODEL_CALLS: "${CITIZENS_JOB_MAX_MODEL_CALLS:-192}"
      CITIZENS_JOB_MAX_ACTIVE_SECONDS: "${CITIZENS_JOB_MAX_ACTIVE_SECONDS:-10800}"

      # ---- resources (brief §6) --------------------------------------------
      MEMORY: 22G                          # ATM guidance 8–12G; bumped for player-count headroom (WSL2 ceiling raised to match)
      USE_AIKAR_FLAGS: "true"

      # ---- server.properties -----------------------------------------------
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "7"
      SIMULATION_DISTANCE: "6"
      ALLOW_FLIGHT: "true"                 # modded movement (jetpacks etc.) — avoids flight kicks
      SYNC_CHUNK_WRITES: "false"
      MAX_TICK_TIME: "-1"                  # disable watchdog; modded servers have long ticks
      DIFFICULTY: normal
      SPAWN_PROTECTION: "0"
      MOTD: "§3ZapeG §f| §bATM9§f+ §8— §7ejderhalar gerçek"
      ENFORCE_SECURE_PROFILE: "false"      # avoids chat-signing kicks on modded
      ONLINE_MODE: "false"                 # accept ALL launchers (no Mojang auth).
                                           # Names, including OP names, are spoofable.
                                           # Owner explicitly accepts that risk — see TUNING.md.

      # ---- access control ---------------------------------------------------
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      ENFORCE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      WHITELIST: ${WHITELIST:-}            # optional comma-separated usernames
      OPS: ${OPS-Mizar__107}                # explicit OPS= clears it; default is accepted spoofable admin

      # ---- rcon (backup sidecar + scripts) ----------------------------------
      # Passed through from .env's RCON_PASSWORD, pinned there deliberately so
      # it survives future recreates/restarts (a blank value here would let
      # itzg regenerate a random secret in /data/.rcon-cli.env on every start,
      # breaking metrics-exporter's login each time). 25575 is not public.
      RCON_PASSWORD:
      STOP_SERVER_ANNOUNCE_DELAY: "20"
    volumes:
      - ./data:/data
      - ./extras:/extras:ro
      - ./overrides/mods:/citizens-mods:ro

  backup:
    image: itzg/mc-backup
    container_name: atm9-backup
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
        restart: true
    environment:
      TZ: Europe/Istanbul
      BACKUP_INTERVAL: 24h                 # brief §6: daily automated
      INITIAL_DELAY: 10m
      PRUNE_BACKUPS_DAYS: "14"
      RCON_HOST: mc
      # No password here: mc-backup auto-reads /data/.rcon-cli.env from SRC_DIR.
      PAUSE_IF_NO_PLAYERS: "false"
      # jars/caches are re-resolvable from pins — world + configs are what matter
      # BlueMap tiles are regenerated from the world; archiving them every day
      # wastes disk and I/O while the renderer is writing.
      EXCLUDES: "*.jar,cache,temp,logs,crash-reports,libraries,versions,bluemap,bluemap/**"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups

  # Shared controller for player-owned and server-owned ZapeG Citizens — OPT-IN:
  # docker compose --profile citizens up -d --build citizen-brain mc backup
  # No host port, Minecraft data, logs, RCON, or Docker socket are exposed.
  citizen-brain:
    image: zapeg/citizen-brain:0.4.0
    build:
      context: https://github.com/Mizar-107/zapeg-citizens.git#0d7e6fc335aa152dbc04b1cd33e8b1ba9128ada7:brain
    container_name: atm9-citizen-brain
    profiles: ["citizens"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CITIZENS_BRAIN_TOKEN: ${CITIZENS_BRAIN_TOKEN:-}
      CITIZENS_LLM_URL: ${CITIZENS_LLM_URL:-https://ollama.com/api/chat}
      CITIZENS_LLM_API_KEY_FILE: /run/secrets/citizens_ollama_api_key
      CITIZENS_LLM_MODEL: ${CITIZENS_LLM_MODEL:-gpt-oss:20b}
      CITIZENS_LLM_QUEUE_TIMEOUT_SECONDS: "20"
      CITIZENS_LLM_TIMEOUT_SECONDS: "90"
      CITIZENS_DB_PATH: /data/citizens-brain.sqlite3
      # Protocol-3 planner/journal caps. The large argument allowance is needed
      # for Numen's bounded multi-thousand-block build plans.
      CITIZENS_MAX_ACTIVE_JOBS: "${CITIZENS_MAX_ACTIVE_JOBS:-16}"
      CITIZENS_MAX_TOOL_ARGUMENT_CHARS: "${CITIZENS_MAX_TOOL_ARGUMENT_CHARS:-262144}"
      CITIZENS_MAX_RESULT_CHARS: "${CITIZENS_MAX_RESULT_CHARS:-16000}"
      CITIZENS_MAX_JOB_CONTEXT_CHARS: "${CITIZENS_MAX_JOB_CONTEXT_CHARS:-65536}"
      CITIZENS_MAX_JOB_CHECKPOINT_CHARS: "${CITIZENS_MAX_JOB_CHECKPOINT_CHARS:-16384}"
      CITIZENS_MAX_JOB_RECENT_EVENTS: "${CITIZENS_MAX_JOB_RECENT_EVENTS:-8}"
      CITIZENS_MAX_JOB_INTERNAL_STEPS: "${CITIZENS_MAX_JOB_INTERNAL_STEPS:-8}"
    secrets:
      - citizens_ollama_api_key
    volumes:
      - citizen-brain-data:/data

  # Metrics stack — OPT-IN: docker compose --profile metrics up -d
  # Grafana is localhost-only by default. Use an SSH tunnel/VPN or authenticated
  # HTTPS reverse proxy; do not publish raw :3000 to the internet.
  metrics-exporter:
    image: ghcr.io/dirien/minecraft-exporter:0.24.0
    container_name: atm9-exporter
    profiles: ["metrics"]
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
        restart: true
    environment:
      MC_RCON_ADDRESS: "mc:25575"
      # Exporter cannot read .rcon-cli.env; metrics needs an explicit shared
      # RCON_PASSWORD in .env before mc + this profile are (re)created.
      MC_RCON_PASSWORD: ${RCON_PASSWORD:-}
      MC_WORLD: /data/world
      # Do not send offline UUIDs to Mojang name lookup. Upstream labels these
      # series by UUID; Prometheus rewrites only the six confirmed exact logins.
      MC_NAME_SOURCE: offline
      MC_MOD_SERVER_STATS: forge         # per-dimension TPS/tick-time via forge rcon
    volumes:
      - ./data:/data:ro

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: atm9-prometheus
    profiles: ["metrics"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # A full season/year remains queryable, but the disk cap wins if needed.
      - "--storage.tsdb.retention.time=400d"
      - "--storage.tsdb.retention.size=10GB"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.0
    container_name: atm9-grafana
    profiles: ["metrics"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      # The fallback is intentionally usable only with the localhost bind above.
      # Set a unique value before any reverse-proxy/VPN publication.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-zapeg-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - graf-data:/var/lib/grafana

  # Heraldor — karanlık varlık — OPT-IN: docker compose --profile heraldor up -d --build
  # Nadir fısıltılar/global mesajlar/Discord postları. HERALDOR_EVENTS=true ile
  # gece-yarısı gölge baskınları da açılır (varsayılan kapalı). LLM opsiyonel.
  heraldor:
    build: ./npc
    container_name: atm9-heraldor
    command: ["python", "-u", "heraldor.py"]
    profiles: ["heraldor"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      mc:
        condition: service_healthy
        restart: true
    environment:
      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_ENV_FILE: /run/secrets/mc-rcon.env
      PYTHONDONTWRITEBYTECODE: "1"
      HERALDOR_WEBHOOK: ${HERALDOR_WEBHOOK:-}
      HERALDOR_EVENTS: ${HERALDOR_EVENTS:-false}
      HERALDOR_LLM: ${HERALDOR_LLM:-false}
      # True only when the separate output-only relay is intentionally live.
      # Existing suppressed rows are terminal and are never revived.
      HERALDOR_VOICE_ENABLED: ${HERALDOR_VOICE_ENABLED:-false}
      CHECK_INTERVAL: ${HERALDOR_CHECK_INTERVAL:-300}
      MINION_POLL_INTERVAL: ${HERALDOR_MINION_POLL_INTERVAL:-10}
      CONTROL_POLL_INTERVAL: ${CONTROL_POLL_INTERVAL:-2}
      # Autonomous scene scheduler — default off; enable only in a copied test
      # world after the two-client privacy gate passes (docs/HERALDOR-RUNBOOK.md).
      HERALDOR_SCENE_SCHEDULER: ${HERALDOR_SCENE_SCHEDULER:-false}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
      STALK_SAMPLE_INTERVAL: ${STALK_SAMPLE_INTERVAL:-45}
      DEATH_POLL_INTERVAL: ${DEATH_POLL_INTERVAL:-30}
      HERALDOR_DB_PATH: /state/heraldor.sqlite3
      HERALDOR_SNAPSHOT_PATH: /state/backup/heraldor.sqlite3
      P_WHISPER: ${HERALDOR_P_WHISPER:-0.002}
      P_GLOBAL: ${HERALDOR_P_GLOBAL:-0.0005}
      P_DISCORD: ${HERALDOR_P_DISCORD:-0.0003}
      P_SHADOWS: ${HERALDOR_P_SHADOWS:-0.0002}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - type: bind
        source: ./data/heraldor
        target: /state
      - type: bind
        source: ./data/.rcon-cli.env
        target: /run/secrets/mc-rcon.env
        read_only: true
        bind:
          create_host_path: false

  # Output-only Discord voice cameo — OPT-IN and isolated from the DCI process.
  # It may authenticate as the same bot account; it never mounts DCI config.
  # Receives no RCON, Minecraft data, webhook, LLM key, or Docker socket.
  heraldor-voice:
    build:
      context: ./npc
      dockerfile: Dockerfile.voice
    container_name: atm9-heraldor-voice
    profiles: ["heraldor-voice"]
    restart: unless-stopped
    read_only: true
    stop_grace_period: 35s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      HERALDOR_DB_PATH: /state/heraldor.sqlite3
      HERALDOR_SNAPSHOT_PATH: /state/backup/heraldor.sqlite3
      HERALDOR_DISCORD_TOKEN_FILE: /run/secrets/heraldor_discord_bot_token
      HERALDOR_DISCORD_GUILD_ID: ${HERALDOR_DISCORD_GUILD_ID:-}
      HERALDOR_DISCORD_VOICE_CHANNEL_ID: ${HERALDOR_DISCORD_VOICE_CHANNEL_ID:-}
      HERALDOR_DISCORD_TEST_VOICE_CHANNEL_ID: ${HERALDOR_DISCORD_TEST_VOICE_CHANNEL_ID:-}
      HERALDOR_DISCORD_SHARED_BOT: ${HERALDOR_DISCORD_SHARED_BOT:-false}
      HERALDOR_VOICE_POLL_SECONDS: ${HERALDOR_VOICE_POLL_SECONDS:-2}
      HERALDOR_VOICE_CONNECT_TIMEOUT_SECONDS: "15"
    secrets:
      - heraldor_discord_bot_token
    volumes:
      - type: bind
        source: ./data/heraldor
        target: /state

  # Offsite backup sync — OPT-IN: docker compose --profile offsite up -d
  # Needs ./rclone.conf (gitignored) with a remote named per RCLONE_DEST in .env
  offsite:
    image: rclone/rclone:latest
    container_name: atm9-offsite
    profiles: ["offsite"]
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'while true; do rclone sync /backups "$$RCLONE_DEST" --transfers 2 -v; sleep 86400; done'
    environment:
      RCLONE_DEST: ${RCLONE_DEST:-}        # e.g. b2:zapeg-backups/world
    volumes:
      - ./backups:/backups:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro

volumes:
  prom-data:
  graf-data:
  citizen-brain-data:

secrets:
  # Created locally by the host; never commit or send it back through chat.
  citizens_ollama_api_key:
    file: ./secrets/citizens_ollama_api_key.txt
  # Relay token. It may duplicate DCI's bot token, or use a dedicated bot.
  heraldor_discord_bot_token:
    file: ./secrets/heraldor_discord_bot_token.txt
