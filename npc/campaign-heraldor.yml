# Heraldor campaign — ZapeG hikaye hattı (v1)
#
# Tek yazarlık dosyası: bölümler (chapters) sırayla, her bölüm beat listesi.
# Beat türleri: scene / whisper / global / discord / servant_wave / wait.
# Hedef seçiciler: birebir oyuncu adı, "random", "last_victim".
# Sürüş: /zapeg-lore story ... (manuel adım veya `story auto on` ile otonom).
# Otonom mod geceleri tercih eder; `any_time: true` gündüz de oynar,
# `day_only: true` yalnız gündüz oynar (HD-5d: sezonda bir kez harcanır).
# Global beat'lerde `style:` — unsigned | glitch | named (HD-2a merdiveni;
# yazılmazsa bölüm tier'ından türetilir: presence→unsigned, servants→glitch,
# manifestation→named). Ad, oyuncular tarafından KAZANILIR; sistem duyurmaz.
# pacing.silence_hours tek sayı ya da [min, max] olabilir (küme başına
# deterministik seçilir — sabit aralık tahmin edilebilir aralıktır, HD-1c).
# Bölümler pacing'i geçersiz kılabilir (accelerando: ch1 en yavaş → ch5 en
# hızlı; HD-1e). Prova: `/zapeg-lore story rehearse` — hiçbir durum yazılmaz.
#
# NOT: Bu dosya oyunculara asla gösterilmez. Heraldor açıklanmaz.

version: 1

pacing:
  # Otonom beats: bir "hareketli gece" en çok cluster_beats beat içerir
  # (cluster_window_minutes içinde), ardından silence_hours sessizlik.
  # Kümeden sonra hiçbir şey iki gece üst üste ateşlemez.
  cluster_beats: 3
  cluster_window_minutes: 45
  silence_hours: [40, 52]

pools:
  # ---------------------------------------------------------------------
  # ASLA listesi (yazarlık yasası — HD-4b; satır eklerken önce bunu oku):
  #  1. Asla oyun-mekaniği kelimesi: mod, sunucu, plugin, lag, chunk,
  #     spawn, render, hitbox, görev/quest, ödül, boss, admin. Tek kelime
  #     bütün geçmiş satırları yama notuna çevirir.
  #  2. Asla talimat/görev ("git", "yap", "bul", "getir"). O gözlemler ve
  #     iddia eder; görev kazanılabilir demektir, kazanılabilir = güvenli.
  #  3. Asla doğrulanabilir sayı. Sayma EYLEMİNİ iddia et ("ben de
  #     sayıyorum."), sonucunu asla ("64 elmasın var" yasak).
  #  4. Asla gerçek dünya verisi: gerçek isim, şehir, iş, okul, gerçek
  #     olay yok. Varlık yalnız oyun içini (ve kanalı) bilir; bu sınır
  #     korkuyu oyun tutar, tehdit yapmaz.
  #  5. Asla kendi adını söylemez. Ad yalnız arayüzden gelir (ölüm ekranı,
  #     4. bölüm+ prefix, webhook). "adımı bildiğini biliyorum. söyleme."
  #     tavandır.
  #  6. Asla cevap vermez. Oyuncular yazacak, tapınak kuracak; yanıt
  #     sessizliktir.
  #  7. Asla ölümle/mezarla alay etmez (motor ≥20 dk mezar-yankı yaşı da
  #     zorlar; burada da yasadır).
  #  8. Asla İngilizce, asla emoji (yerleşik 🕯 hariç), asla BÜYÜK HARF
  #     (5. bölümün tescilli kırılması hariç).
  # ---------------------------------------------------------------------
  generic:
    - "arkana bakma."
    - "kazma sesini duyuyorum. hep duyuyorum."
    - "o meşaleyi ben söndürmedim."
    - "yalnız değilsin. hiç olmadın."
    - "kapıyı açık bıraktın."
    - "seni sayıyorum."
    - "bu gece ışığını söndürme. fark etmez ama."
    - "adımı bildiğini biliyorum. söyleme."
  dossier:
    SalihKarahan:
      - "yaktığın evlerin dumanı hâlâ burnumda."
      - "çakmaktaşını bırak. artık ben yakarım."
      - "ateş seni sevmiyor salih. beni seviyor."
      - "külleri saklıyorum. hepsini."
      - "o yangınlar sönmedi. içeride yanıyor."
      - "bu ev ahşap. saydım."
    kralxlarge:
      - "kaç elmas oldu? ben de sayıyorum."
      - "bu kadar hızlı kazma. beni bulacaksın."
      - "zartinium yok. hiç olmadı. kazmaya devam et."
      - "seni geçtim. fark etmedin."
      - "hızlısın. ben hiç durmuyorum."
      - "kazdığın tünelin sonunu ben açtım."
    MertOnal:
      - "garajındaki şey bu gece kendi kendine çalıştı."
      - "motor sesi sandığın şey benim nefesimdi."
      - "demir mi arıyorsun. ben nerede olduğunu biliyorum."
      - "koltuğunu geri ittim. sığmıyorum."
      - "lastiklerinde çamur var. sen sürmedin."
      - "farların bu gece iki kez yandı. içerden."
    eminomi12:
      - "hayvanların neden hep aynı duvara bakıyor sanıyorsun?"
      - "kurtların bu gece sana havlamadı. bana havladı."
      - "bedava çalışıyorsun. yakında bana çalışacaksın."
      - "köyde bir kapı fazla. say."
      - "sen uyurken sürünü ben sayıyorum."
      - "bir tanesi artık beni seviyor."
    Thekingim:
      - "gökyüzünde yalnız olduğunu mu sandın?"
      - "yukarı çıktıkça bana yaklaşıyorsun."
      - "bulutların üstünde ayak izleri var. senin değil."
      - "sandıklardan aldıklarını saydım. geri koymana gerek yok."
      - "başkasının cevheri seni benden hızlı kazdırmaz."
      - "iniş yerini ben seçiyorum."
    Darkfire6161:
      - "herkes seni seviyor. ben en çok seveceğim."
      - "sana hep özel davranıyorlar. ben de özel davranacağım."
      - "deniz kenarından geldin. ben daha derinden geldim."
      - "adını hep güzel anıyorlar. ben de anacağım."
      - "seni koruyorlar. benden koruyamazlar."
      - "en sevilen ilk gider."

chapters:
  # ---------------------------------------------------------------- 1 ----
  - id: sessiz-komsu
    title: "Sessiz Komşu"
    tier: presence
    # Accelerando (HD-1e): sezon boyu sessizlik kısalır; 1. bölüm en yavaş.
    pacing: { silence_hours: [56, 72] }
    beats:
      # HD-1a: ilk temas bir TEKİL olmalı; Discord'da kuşkuya dönüşmesi
      # için tam bir tartışma yarı ömrü (52 gerçek saat) bekletilir.
      - { type: whisper, pool: dossier, target: random, label: "ilk fısıltı" }
      - { type: wait, real_hours: 52, label: "ilk temas demlensin" }
      - { type: scene, profile: peripheral_01, target: random, label: "göz ucunda" }
      - { type: wait, real_hours: 41, label: "bir gün dur" }
      - { type: whisper, pool: generic, target: random, label: "ikinci fısıltı" }
      - { type: scene, profile: echo_01, target: last_victim, label: "figür ilk kez" }
      - { type: wait, manual: true, label: "2. bölüme OP karar verir" }

  # ---------------------------------------------------------------- 2 ----
  - id: izleniyorsun
    title: "İzleniyorsun"
    tier: presence
    pacing: { silence_hours: [42, 54] }
    beats:
      # HD-2a: erken globaller imzasız ve küçük harf — eşzamanlılık imzadır.
      - { type: global, line: "ışıklarınızı saydım. bir eksik.", style: unsigned, label: "herkese ilk mesaj" }
      - { type: scene, profile: sky_mark_01, target: random, label: "yanlış ay" }
      - { type: wait, game_nights: 2, label: "iki gece" }
      - { type: whisper, pool: dossier, target: last_victim, label: "kişisel fısıltı" }
      - { type: scene, profile: threshold_01, target: last_victim, label: "eşikte yarım figür" }
      - { type: discord, line: "biriniz bu gece geç saate kadar oynayacak. biliyorum.", label: "kanala sızıntı" }
      - { type: wait, manual: true, label: "3. bölüme OP karar verir" }

  # ---------------------------------------------------------------- 3 ----
  - id: adimlar
    title: "Adımlar"
    tier: servants
    pacing: { silence_hours: [34, 46] }
    beats:
      # HD-3b "kapı kehaneti" (2→3 sınırı): B'ye kehanet, ertesi gece A'ya
      # olmayan kapı. Çakışma tutarlı: A == B ise kendine inanmaması söylendi.
      - { type: whisper, line: "yakında biriniz bir kapı görecek. inanmayın ona.", target: random, label: "kehanet — B" }
      - { type: wait, game_nights: 1, label: "bir gece" }
      - { type: scene, profile: false_passage_01, target: random, label: "olmayan kapı — A" }
      - { type: wait, game_nights: 1, label: "ertesi gece" }
      - { type: scene, profile: whisper_steps_01, target: random, label: "kendi adımların" }
      - { type: wait, game_nights: 1, label: "bir gece" }
      - { type: scene, profile: footsteps_01, target: last_victim, label: "yaklaşan adımlar" }
      - { type: whisper, pool: dossier, target: last_victim, label: "adımlardan sonra" }
      - { type: wait, real_hours: 30, label: "nefes payı" }
      # HD-5d "gündüz nöbeti": sezonda BİR kez, öğrenilmiş gündüz güvenliği
      # bilerek harcanır. Ses-only profil gündüz de gece kadar yanlıştır.
      - { type: scene, profile: whisper_steps_01, target: last_victim, day_only: true, label: "öğlen adımları" }
      - { type: scene, profile: closing_steps_01, target: last_victim, label: "üç blok kala" }
      - { type: scene, profile: near_miss_01, target: last_victim, label: "arkandan geçti" }
      - { type: wait, manual: true, label: "4. bölüme OP karar verir" }

  # ---------------------------------------------------------------- 4 ----
  - id: hizmetkarlar
    title: "Hizmetkârlar"
    tier: servants
    pacing: { silence_hours: [26, 38] }
    beats:
      # glitch: bir şey imzalıyor ama okunamıyor — ad ancak ölüm ekranında
      # (hizmetkâr) keşfedilir; sistem asla önce söylemez (HD-2a).
      - { type: global, line: "yalnız gelmedim.", style: glitch, label: "uyarı" }
      - { type: servant_wave, count: 2, target: random, label: "ilk dalga" }
      - { type: wait, victories: 2, label: "iki zafer beklenir" }
      - { type: scene, profile: footsteps_01, target: last_victim, label: "zaferin bedeli" }
      - { type: servant_wave, count: 1, target: last_victim, label: "kişisel hizmetkâr" }
      - { type: wait, victories: 3, label: "üçüncü zafer (ses klibi eşiği)" }
      - { type: discord, line: "üçünü de saydım. geri kalanı daha kolay.", label: "eşikten sonra" }
      - { type: wait, manual: true, label: "finale OP karar verir" }

  # ---------------------------------------------------------------- 5 ----
  - id: tezahur
    title: "Tezahür"
    tier: manifestation
    # Finalde motor artık kendini frenlemiyor (terminal hızlanma).
    pacing: { silence_hours: [14, 22] }
    beats:
      - { type: scene, profile: colossus_01, target: random, label: "ufukta leke (evre 0)" }
      - { type: wait, game_nights: 2, label: "iki gece" }
      - { type: scene, profile: colossus_01, target: last_victim, label: "uzak figür (evre 1)" }
      - { type: whisper, pool: dossier, target: last_victim, label: "yaklaşırken fısıltı" }
      - { type: wait, game_nights: 2, label: "iki gece" }
      - { type: scene, profile: colossus_01, target: last_victim, label: "beliriyor (evre 2)" }
      - { type: scene, profile: eclipse_01, target: last_victim, label: "ışık gider" }
      - { type: wait, real_hours: 30, label: "bir gün dur" }
      - { type: scene, profile: colossus_01, target: last_victim, label: "tepende (evre 3)" }
      # HD-1d/6a: kurban devi Discord'a anlatabilsin diye kısa nefes.
      - { type: wait, real_hours: 0.3, label: "nefes" }
      - { type: scene, profile: witness_01, target: last_victim, label: "gözler her yerde" }
      # HD-6a: ziyaret finalden ÖNCE — oyun dışı artefakt kapanış argümanı
      # olamaz; sorularını devin son görünüşü bastırır. OP notu: yalnız gece,
      # hedef pencere/borderless moddayken ve yayında/kayıtta DEĞİLKEN.
      - { type: wait, manual: true, label: "ziyaret için OP karar verir (gece, hedef canlı yayında değilken)" }
      - { type: scene, profile: visitation_01, target: last_victim, any_time: true, label: "pencerenin dışı" }
      - { type: wait, game_nights: 1, label: "son gece" }
      - { type: scene, profile: colossus_01, target: last_victim, label: "durdu ve baktı (final evre 4)" }
      - { type: global, line: "Gördü. Artık hepiniz görüldünüz.", style: named, label: "tanıklık" }
      # HD-6a: kapanış discord beat'i SİLİNDİ — kampanya sessizlikle biter.
      # Ziyareti hiçbir kanal asla imzalamaz; son söz yokluktur.
